
name: Deploy New API

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: image=moby/buildkit:latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/new-api:${{ env.IMAGE_TAG }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker buildx build --platform linux/arm64 --push \
            -t "$IMAGE" \
            -t ghcr.io/$OWNER/new-api:latest \
            .

      - name: Deploy with Compose
        env:
          NEWAPI_PATH: ${{ secrets.NEWAPI_PATH }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -euo pipefail

          echo "[INFO] Deploying image: $IMAGE"

          mkdir -p "$NEWAPI_PATH/data"
          mkdir -p "$NEWAPI_PATH/logs"

          echo "[INFO] Writing runtime environment"
          {
            printf 'IMAGE=%s\n' "$IMAGE"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
          } > "$NEWAPI_PATH/.env"

          chmod 600 "$NEWAPI_PATH/.env"

          echo "[INFO] Syncing production Docker Compose..."
          cp "$GITHUB_WORKSPACE/docker-compose.yml" \
             "$NEWAPI_PATH/docker-compose.yml"

          echo "[INFO] Pulling image..."
          docker compose \
            -p newapi \
            --project-directory "$NEWAPI_PATH" \
            --env-file "$NEWAPI_PATH/.env" \
            -f "$GITHUB_WORKSPACE/docker-compose.yml" \
            pull new-api

          echo "[INFO] Restarting service..."
          docker compose \
            -p newapi \
            --project-directory "$NEWAPI_PATH" \
            --env-file "$NEWAPI_PATH/.env" \
            -f "$GITHUB_WORKSPACE/docker-compose.yml" \
            up -d --no-deps new-api
